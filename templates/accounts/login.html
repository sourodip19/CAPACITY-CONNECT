{% extends 'base.html' %}
{% block title %}Login | Capacity Connect{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-1">Welcome back</h1>
            <p class="text-muted mb-4">Sign in to continue your learning journey.</p>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'includes/form_fields.html' with form=form %}
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="mt-4 mb-0 text-center text-muted small">
                New student? <a href="{% url 'accounts:register' %}">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
